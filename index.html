<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Saya</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(-45deg,#2193b0,#6dd5ed,#cc2b5e,#753a88);
    background-size:400% 400%;
    animation:bg 10s ease infinite;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
    width:320px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:30px;
    text-align:center;
    color:white;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
    transition:.4s;
}

.card:active{
    transform:translateY(-10px) scale(1.03);
}

.foto{
    <img src="Screenshot_2026-07-11-16-28-34-921_com.google.android.apps.photos.jpg" class="foto" alt="Foto">
}

@keyframes putar{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

h1{
margin-top:15px;
}

.bio{
margin:15px 0 25px;
}

.btn{
display:inline-block;
text-decoration:none;
color:white;
background:#ff4b2b;
padding:12px 25px;
border-radius:30px;
transition:.3s;
}

.btn:active{
background:#ff416c;
transform:scale(1.1);
box-shadow:0 0 20px #ff416c;
}

</style>
</head>
<body>

<div class="card">
<img src="naruto.jpg" class="foto" alt="Foto">

<h1>WEB BELAJAR</h1>
<p class="bio">HALO SELAMAT DATANG DI WEBSITE SAYA</p>

<a href="https://www.google.com" class="btn">MASUK</a>
</div>

</body>
</html>
<head><link rel="stylesheet" href="style.css"></head>
